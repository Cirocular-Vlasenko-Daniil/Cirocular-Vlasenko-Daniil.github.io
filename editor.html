<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online Zine Maker — make a zine free, no sign-up | 10 minute zine</title>
<meta name="description" content="Free online one page zine maker: build an 8-page mini zine from ready-made blocks and download a print-ready PDF for A4 or US Letter.">
<link rel="canonical" href="https://10minutezine.com/editor.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="10 minute zine">
<meta property="og:title" content="Online Zine Maker — make a zine free, no sign-up">
<meta property="og:description" content="Free online one page zine maker: build an 8-page mini zine and download a print-ready PDF.">
<meta property="og:url" content="https://10minutezine.com/editor.html">
<meta property="og:image" content="https://10minutezine.com/img/og-en.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css?v=a9c1ab4d">
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/fontkit.umd.min.js"></script>
<script src="vendor/qrcode.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="zf-gray" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/></filter>
    <filter id="zf-sil" color-interpolation-filters="sRGB"><feComponentTransfer in="SourceAlpha" result="a"><feFuncA type="discrete" tableValues="0 1"/></feComponentTransfer><feFlood flood-color="#fff"/><feComposite in2="a" operator="in"/></filter>
    <filter id="zf-gray-hard" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="discrete" tableValues="0 1"/></feComponentTransfer></filter>
    <filter id="zf-gray-inv" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="table" tableValues="1 0"/><feFuncG type="table" tableValues="1 0"/><feFuncB type="table" tableValues="1 0"/></feComponentTransfer></filter>
    <pattern id="zf-hatch" width="1.6" height="1.6" patternUnits="userSpaceOnUse">
      <rect width="0.8" height="0.8" fill="#dcdcdc"/>
    </pattern>
  </defs>
</svg>

<header class="top">
  <a class="logo" href="./" title="10 minute zine"><i></i>10 minute zine</a>
  <input id="title" class="title" spellcheck="false" maxlength="60">
  <div class="seg" id="sideTabs"></div>
  <div class="seg" id="viewTabs">
    <button data-view="pages" data-i18n>Страницы</button>
    <button data-view="sheet" data-i18n>Лист</button>
  </div>
  <span class="grow"></span>
  <span class="saved" id="saved"></span>
  <button id="undo" title="Отменить (⌘Z)" data-i18n-title>↶</button>
  <button id="redo" title="Вернуть (⇧⌘Z)" data-i18n-title>↷</button>
  <div class="seg lang" id="langSwitch"><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
  <button id="exportBtn" class="primary">PDF ↓</button>
</header>

<main>
  <aside class="left">
    <div class="cap" data-i18n>Блоки</div>
    <div id="palette"></div>
  </aside>
  <section class="stage">
    <div id="canvas"></div>
    <nav id="nav"></nav>
  </section>
  <aside class="right">
    <div class="filebar" id="filebar">
      <button data-act="new" data-i18n>Новый</button><button data-act="sample" data-i18n>Пример</button>
      <button data-act="open" data-i18n>Открыть</button><button data-act="save" data-i18n>Сохранить</button>
    </div>
    <div id="inspector"></div>
  </aside>
</main>

<nav class="mbar" id="mbar">
  <button data-sheet="palette"><span class="mb-plus">+</span> <span data-i18n>Блоки</span></button>
  <button data-sheet="inspector"><span data-i18n>Свойства</span><i class="mb-dot"></i></button>
  <button data-proxy="undo" aria-label="Undo"></button>
  <button data-proxy="redo" aria-label="Redo"></button>
  <button data-proxy="exportBtn" class="primary">PDF ↓</button>
</nav>

<div id="modal" hidden></div>
<div id="toast"></div>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileZine" accept=".zine,.json" hidden>
<script>
  // Если модули не загрузились (часто — старая версия в кэше), показываем причину вместо пустого экрана
  window.addEventListener('error', (e) => {
    if (document.querySelector('#palette .tile') || document.getElementById('bootErr')) return;
    const d = document.createElement('div');
    d.id = 'bootErr';
    d.className = 'warn';
    d.style.cssText = 'position:fixed;left:50%;top:80px;transform:translateX(-50%);background:#fff;z-index:99;max-width:480px';
    d.innerHTML = 'Редактор не запустился — обнови страницу с очисткой кэша: <b>⇧⌘R</b>.<br>The editor failed to start — hard-reload the page: <b>⇧⌘R</b>.<br><small>' + String(e.message).replace(/</g, '&lt;') + '</small>';
    document.body.appendChild(d);
  });
</script>
<script type="module" src="js/main.js?v=a9c1ab4d"></script>
</body>
</html>
